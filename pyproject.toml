# =============================================================================
# MAIE Jetson Branch - ASR-Only Edition
# =============================================================================
# This is the simplified Jetson Nano/Orin branch configuration.
# Features: ASR only (no LLM summarization, no diarization)
# Platform: ARM64 (linux-aarch64)
# See docs/JETSON_NANO_BRANCH_PLAN.md for branch strategy and sync workflows.
#
# Key differences from main branch:
# - No vLLM, flashinfer (no ARM64 support)
# - No pyannote-audio, torchcodec (no ARM64 wheels)
# - No Redis/RQ (synchronous edge API)
# - Custom ARM64 wheels for ctranslate2
# =============================================================================

[project]
name = "maie"
version = "0.1.0"
description = "MAIE - Jetson ASR Edition (Modular Audio Intelligence Engine)"
readme = "README.md"
requires-python = ">=3.10"

# Minimal dependencies for ASR-only operation
# Removed: rq-dashboard, redis-related, llm-related
dependencies = [
    "pydantic>=2.12.5,<3",
    "pydantic-settings>=2.12.0,<3",
    "jsonschema>=4.25.1,<5",
    "python-levenshtein>=0.27.3,<0.28",
    "soxr>=1.0.0,<2",
    "transformers>=4.57.3,<5",
    "onnxruntime>=1.23.2,<2",
    "silero-vad>=6.2.0,<7",
    "numpy<2",
    "faster-whisper>=1.2.1,<2",
    "ctranslate2>=4.6.0",
    "sniffio>=1.3.0,<2",
]


[dependency-groups]
dev = ["pytest>=8.4.2,<9", "pytest-timeout>=2.4.0,<3","pytest-mock>=3.15.1,<4", "dead>=2.1.0,<3", "fakeredis>=2.32.0,<3"]


[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "--disable-warnings",
]
markers = [
    "integration: marks tests as integration tests (may require real libraries)",
    "slow: marks tests as slow (>5 seconds)",
    "gpu: marks tests as requiring GPU hardware",
    "real_llm: marks tests that make real LLM API calls (requires API keys)",
    "unit: marks tests as unit tests (fast, mocked)",
    "asyncio: marks tests as async tests",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
timeout = 300
timeout_method = "thread"

[tool.pixi.workspace]
channels = ["conda-forge", "pytorch", "nvidia"]
# Jetson-only build: linux-aarch64 for Jetson Orin Nano Super
platforms = ["linux-aarch64"]

# Jetson PyPI configuration for accessing Jetson-optimized packages
# Use index-strategy to allow best-match across all indexes for ARM64 compatibility
[tool.pixi.pypi-options]
extra-index-urls = ["https://pypi.jetson-ai-lab.io/jp6/cu126/+simple/"]
index-strategy = "unsafe-best-match"

[tool.pixi.dependencies]
# Python 3.10 required for Jetson AI Lab wheels (ctranslate2, vllm are cp310)
python = "3.10.*"
ffmpeg = "*"

[tool.pixi.pypi-dependencies]
maie = { path = ".", editable = true }
chunkformer = "*"
litestar = { version = "*", extras = ["standard"] }
# No vLLM on Jetson - ASR only
torch = "== 2.8.0"
torchaudio = "== 2.8.0"
# No Redis/RQ on Jetson - using synchronous edge API
huggingface-hub = "*"
loguru = "*"
ctranslate2 = { path = "/home/vietinnotech/jetsonpack/wheels/ctranslate2-4.6.1-cp310-cp310-linux_aarch64.whl" }
sniffio = "*"
aiofiles = "*"
uvicorn = "*"

[tool.pixi.feature.dev.pypi-dependencies]
pytest-asyncio = ">=1.2.0, <2"
pytest-cov = ">=7.0.0, <8"
ruff = ">=0.14.0, <0.15"

[tool.pixi.feature.dev.tasks]
test = "pytest tests/unit"
test-debug = "pytest -vv --tb=long --showlocals -ra -s tests/unit"
lint = "ruff check --fix"
format = "ruff format"
# Jetson uses edge_main.py (simplified synchronous API)
serve = "uvicorn src.api.edge_main:app --host 0.0.0.0 --port 8000 --workers 1"
api = "uvicorn src.api.edge_main:app --host 0.0.0.0 --port 8000"
style = "ruff check --fix && ruff format -v && dead"
download-models = "bash scripts/download-models.sh"

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.activation.env]
LD_LIBRARY_PATH = "$CONDA_PREFIX/lib/python3.10/site-packages/nvidia/cudnn/lib:$CONDA_PREFIX/lib/python3.10/site-packages/nvidia/cuda_runtime/lib:$LD_LIBRARY_PATH"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

